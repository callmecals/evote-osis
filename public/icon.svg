<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corner (Safe zone compliant) -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />

  <!-- Background Pattern / Subtle Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="20" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="12" />

  <!-- Ballot Box & Card Symbol -->
  <g filter="url(#shadow)">
    <!-- Ballot Box Base -->
    <rect x="120" y="220" width="272" height="190" rx="28" fill="#ffffff" />
    <path d="M120 280 L392 280" stroke="#f1f5f9" stroke-width="3" />
    
    <!-- Box Front Details / OSIS Badge -->
    <rect x="220" y="310" width="72" height="50" rx="12" fill="#eff6ff" />
    <circle cx="256" cy="335" r="14" fill="#2563eb" />
    <path d="M250 335 L254 339 L262 331" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Box Slot -->
    <rect x="180" y="206" width="152" height="28" rx="8" fill="#1e293b" />
    <rect x="200" y="216" width="112" height="8" rx="4" fill="#0f172a" />

    <!-- Ballot Paper Entering Slot -->
    <g transform="translate(0, -10)">
      <rect x="176" y="90" width="160" height="130" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      <!-- Candidate Lines on Paper -->
      <line x1="200" y1="120" x2="250" y2="120" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
      <line x1="200" y1="140" x2="270" y2="140" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
      
      <!-- Voting Checkmark Stamp -->
      <circle cx="295" cy="130" r="18" fill="url(#accentGrad)" />
      <path d="M287 130 L293 136 L304 124" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
